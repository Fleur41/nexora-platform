name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-not-secret
      DATABASE_URL: postgres://nexora:nexora_ci_password@localhost:5432/nexora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR --settings=config.settings.prod
        env:
          DJANGO_ALLOWED_HOSTS: example.com
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora" --health-interval 5s
          --health-timeout 5s --health-retries 10
      # Catches outgoing email; the tenant portal test reads its invitation link from here.
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["8025:8025", "1025:1025"]
    env:
      DJANGO_SECRET_KEY: ci-not-secret
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      # Every browser test signs up fresh accounts; the production limit (10/min) is too low.
      THROTTLE_AUTH: 1000/min
      DATABASE_URL: postgres://nexora:nexora_ci_password@localhost:5432/nexora
      CELERY_TASK_ALWAYS_EAGER: "true"
      # No Redis in this job: use the in-process cache for throttling.
      DJANGO_SETTINGS_MODULE: config.settings.e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python manage.py migrate --noinput
          # The platform console test signs in as Nexora staff; only the CLI can grant that.
          python manage.py platform_admin e2e-platform@example.com --create --password Nexora-e2e-pass-2026
          python manage.py runserver 127.0.0.1:8000 > /tmp/django.log 2>&1 &
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000/login http://127.0.0.1:8000/api/v1/health/
      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Regression journey
        working-directory: frontend
        run: npm run test:regression:ci
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Server logs on failure
        if: failure()
        run: cat /tmp/django.log /tmp/next.log
