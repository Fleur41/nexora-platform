name: nexora

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP catcher: every email the app sends shows up at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
      args: { REQUIREMENTS: requirements-dev.txt }
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://nexora:${POSTGRES_PASSWORD:-nexora_dev_password}@db:5432/nexora
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args: { REQUIREMENTS: requirements-dev.txt }
    command: celery -A config worker -l info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://nexora:${POSTGRES_PASSWORD:-nexora_dev_password}@db:5432/nexora
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduled jobs (e.g. hourly occupancy sync). Run exactly one beat process.
  beat:
    build:
      context: ./backend
      args: { REQUIREMENTS: requirements-dev.txt }
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://nexora:${POSTGRES_PASSWORD:-nexora_dev_password}@db:5432/nexora
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev
    environment:
      NEXORA_API_ORIGIN: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
